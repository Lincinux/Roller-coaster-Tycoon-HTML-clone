<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ThrillEngine 3D | Theme Park Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 0.160.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; outline: none; }
        
        /* UI Glassmorphism */
        .ui-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .item-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
        .item-card:active { transform: scale(0.95); }
        .item-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        
        /* Category Tabs */
        .category-tab {
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .category-tab:hover { color: white; background: rgba(255,255,255,0.1); }
        .category-tab.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        /* Guest Inspector */
        #guest-inspector { pointer-events: none; transition: opacity 0.2s; }
        
        /* Scrollbar */
        .scroller::-webkit-scrollbar { height: 6px; }
        .scroller::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-20">
        <div class="ui-panel px-6 py-3 rounded-xl pointer-events-auto flex items-center gap-6">
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Funds</div>
                <div class="text-2xl font-bold text-emerald-400">$<span id="money-display">10,000</span></div>
            </div>
            <div class="h-8 w-px bg-slate-600"></div>
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Guests</div>
                <div class="text-2xl font-bold text-blue-400"><span id="guest-count">0</span></div>
            </div>
             <div class="h-8 w-px bg-slate-600"></div>
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Rating</div>
                <div class="text-2xl font-bold text-amber-400"><span id="rating-display">500</span></div>
            </div>
        </div>

        <div class="ui-panel px-4 py-2 rounded-xl pointer-events-auto text-right">
            <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent italic">ThrillEngine 3D</h1>
            <p class="text-xs text-slate-400">WASD to Pan • Right-Click Drag to Rotate • <span class="text-white font-bold">R</span> to Rotate Build</p>
        </div>
    </div>

    <!-- Notification Area -->
    <div id="notifications" class="fixed top-24 right-4 flex flex-col gap-2 pointer-events-none z-20 w-64"></div>

    <!-- Guest Inspector -->
    <div id="guest-inspector" class="fixed hidden z-30 ui-panel p-4 rounded-xl w-64 shadow-2xl border-l-4 border-blue-500">
        <h3 class="font-bold text-lg mb-1" id="gi-name">Guest</h3>
        <div class="text-sm text-slate-300 mb-3 italic" id="gi-thought">"This park is clean!"</div>
        <div class="grid grid-cols-2 gap-2 text-xs font-mono">
            <div class="bg-slate-800 p-1 rounded text-center"><span class="block text-slate-400">Cash</span><span class="text-emerald-400" id="gi-cash">$0</span></div>
            <div class="bg-slate-800 p-1 rounded text-center"><span class="block text-slate-400">Happy</span><span class="text-amber-400" id="gi-happy">0%</span></div>
        </div>
    </div>

    <!-- Bottom Toolbar -->
    <div class="fixed bottom-0 left-0 w-full flex flex-col items-center pointer-events-none z-20 pb-4">
        <!-- Categories -->
        <div class="ui-panel mb-2 rounded-lg flex gap-1 pointer-events-auto p-1">
            <div class="category-tab active" onclick="filterToolbar('all')">All</div>
            <div class="category-tab" onclick="filterToolbar('ride')">Rides</div>
            <div class="category-tab" onclick="filterToolbar('shop')">Shops</div>
            <div class="category-tab" onclick="filterToolbar('scenery')">Scenery</div>
        </div>
        
        <!-- Items -->
        <div class="ui-panel p-2 rounded-2xl pointer-events-auto flex gap-2 overflow-x-auto scroller max-w-[90vw]">
            <div id="toolbar" class="flex gap-2"></div>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full bg-slate-900 cursor-crosshair"></div>

    <script>
        /** * THRILLENGINE 3D - ULTIMATE EDITION */

        // --- Game State ---
        const Game = {
            money: 10000,
            guests: [],
            buildings: {}, 
            gridSize: 60,
            tileSize: 10,
            tick: 0,
            selectedTool: null, 
            rotation: 0, 
            entrance: { x: 0, z: 280 },
            selectedGuest: null,
            filter: 'all'
        };

        // --- Asset Definitions ---
        const BUILDING_TYPES = {
            // Infrastructure
            PATH: { id: 'path', name: 'Path', cost: 10, color: '#78716c', icon: '🛣️', type: 'infrastructure', w:1, d:1, category: 'scenery' },
            
            // Rides - Coasters
            RIDE_COASTER: { id: 'ride_coaster', name: 'The Titan', cost: 5000, color: '#3b82f6', icon: '🎢', type: 'ride', ticketPrice: 15, excitement: 90, w:6, d:3, category: 'ride' },
            
            // Rides - Flat
            RIDE_PIRATE: { id: 'ride_pirate', name: 'Pirate Ship', cost: 1500, color: '#854d0e', icon: '🏴‍☠️', type: 'ride', ticketPrice: 8, excitement: 55, w:3, d:1, category: 'ride' },
            RIDE_FERRIS: { id: 'ride_ferris', name: 'Ferris Wheel', cost: 1200, color: '#ef4444', icon: '🎡', type: 'ride', ticketPrice: 6, excitement: 40, w:1, d:1, category: 'ride' },
            RIDE_DROP: { id: 'ride_drop', name: 'Drop Tower', cost: 2000, color: '#8b5cf6', icon: '🗼', type: 'ride', ticketPrice: 10, excitement: 75, w:1, d:1, category: 'ride' },
            RIDE_CAROUSEL: { id: 'ride_carousel', name: 'Carousel', cost: 1000, color: '#ec4899', icon: '🎠', type: 'ride', ticketPrice: 5, excitement: 30, w:2, d:2, category: 'ride' },
            RIDE_TEACUP: { id: 'ride_teacup', name: 'Tea Cups', cost: 800, color: '#d946ef', icon: '☕', type: 'ride', ticketPrice: 4, excitement: 25, w:1, d:1, category: 'ride' },
            RIDE_UFO: { id: 'ride_ufo', name: 'U.F.O', cost: 1800, color: '#10b981', icon: '🛸', type: 'ride', ticketPrice: 9, excitement: 60, w:2, d:2, category: 'ride' },
            RIDE_CHAIRSWING: { id: 'ride_chairswing', name: 'Chair Swing', cost: 1100, color: '#f97316', icon: '🎪', type: 'ride', ticketPrice: 5, excitement: 35, w:2, d:2, category: 'ride' },
            RIDE_TWISTER: { id: 'ride_twister', name: 'Twister', cost: 1400, color: '#eab308', icon: '🌪️', type: 'ride', ticketPrice: 7, excitement: 50, w:1, d:1, category: 'ride' },

            // Shops & Facilities
            SHOP_BURGER: { id: 'shop_burger', name: 'Burger Stall', cost: 300, color: '#f59e0b', icon: '🍔', type: 'shop', income: 15, w:1, d:1, category: 'shop' },
            SHOP_ICECREAM: { id: 'shop_icecream', name: 'Ice Cream', cost: 250, color: '#fbcfe8', icon: '🍦', type: 'shop', income: 8, w:1, d:1, category: 'shop' },
            SHOP_HOTDOG: { id: 'shop_hotdog', name: 'Hot Dog', cost: 200, color: '#ef4444', icon: '🌭', type: 'shop', income: 6, w:1, d:1, category: 'shop' },
            SHOP_INFO: { id: 'shop_info', name: 'Info Kiosk', cost: 150, color: '#3b82f6', icon: 'ℹ️', type: 'shop', income: 2, w:1, d:1, category: 'shop' },
            FACILITY_RESTROOM: { id: 'facility_restroom', name: 'Restroom', cost: 400, color: '#94a3b8', icon: '🚻', type: 'facility', w:1, d:1, category: 'shop' },

            // Scenery
            SCENERY_FOUNTAIN: { id: 'scenery_fountain', name: 'Fountain', cost: 150, color: '#60a5fa', icon: '⛲', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_TREE: { id: 'scenery_tree', name: 'Oak Tree', cost: 50, color: '#22c55e', icon: '🌳', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_BUSH: { id: 'scenery_bush', name: 'Hedge', cost: 20, color: '#166534', icon: '🌿', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_FLOWER: { id: 'scenery_flower', name: 'Flowers', cost: 15, color: '#f43f5e', icon: '🌺', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_ROCK: { id: 'scenery_rock', name: 'Large Rock', cost: 30, color: '#57534e', icon: '🪨', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_LAMP: { id: 'scenery_lamp', name: 'Lamp Post', cost: 25, color: '#fde047', icon: '💡', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_BENCH: { id: 'scenery_bench', name: 'Bench', cost: 15, color: '#92400e', icon: '🪑', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_TRASH: { id: 'scenery_trash', name: 'Trash Can', cost: 10, color: '#4b5563', icon: '🗑️', type: 'scenery', w:1, d:1, category: 'scenery' },
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 100, 900);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(200, 200, 200);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(150, 300, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.bias = -0.0005;
        const d = 400;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- Ground & Grid ---
        const mapSize = Game.gridSize * Game.tileSize;
        const groundGeo = new THREE.PlaneGeometry(mapSize * 2, mapSize * 2);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(mapSize, Game.gridSize, 0xffffff, 0xffffff);
        gridHelper.material.opacity = 0.1;
        gridHelper.material.transparent = true;
        gridHelper.position.set(0, 0.1, 0);
        scene.add(gridHelper);

        const highlightMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5 })
        );
        highlightMesh.visible = false;
        scene.add(highlightMesh);

        // --- Procedural Asset Generators ---

        function getMaterial(color) {
            return new THREE.MeshStandardMaterial({ color: color });
        }

        function createTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 3, 6), getMaterial(0x5d4037));
            trunk.position.y = 1.5; trunk.castShadow = true;
            group.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.5, 7, 8), getMaterial(0x15803d));
            leaves.position.y = 5; leaves.castShadow = true;
            group.add(leaves);
            return group;
        }

        function createLamp() {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), getMaterial(0x1e293b));
            pole.position.y = 4; group.add(pole);
            const box = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), getMaterial(0xfde047));
            box.position.y = 8; group.add(box);
            return group;
        }

        function createTrashCan() {
            const group = new THREE.Group();
            const can = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, 2.5), getMaterial(0x4b5563));
            can.position.y = 1.25; can.castShadow = true;
            group.add(can);
            return group;
        }

        function createBush() {
             const group = new THREE.Group();
             const b = new THREE.Mesh(new THREE.DodecahedronGeometry(2), getMaterial(0x166534));
             b.position.y = 1.5; b.castShadow = true;
             group.add(b);
             return group;
        }

        function createFlower() {
            const group = new THREE.Group();
            const bed = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 8), getMaterial(0x5d4037));
            bed.position.y = 0.25; group.add(bed);
            
            for(let i=0; i<5; i++) {
                const f = new THREE.Mesh(new THREE.SphereGeometry(0.8), getMaterial(0xf43f5e));
                f.position.set((Math.random()-0.5)*6, 1, (Math.random()-0.5)*6);
                group.add(f);
            }
            return group;
        }

        function createRock() {
            const group = new THREE.Group();
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(3, 0), getMaterial(0x57534e));
            rock.scale.set(1.2, 0.8, 1);
            rock.position.y = 1.5; rock.castShadow = true;
            group.add(rock);
            return group;
        }

        function createFountain() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 1), getMaterial(0x94a3b8));
            base.position.y = 0.5; group.add(base);
            const water = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 0.8), getMaterial(0x3b82f6));
            water.position.y = 0.6; group.add(water);
            const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3), getMaterial(0x94a3b8));
            spout.position.y = 1.5; group.add(spout);
            group.userData = { type: 'anim_fountain', timer: 0 };
            return group;
        }

        function createShop(color, type) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 8), getMaterial(0xffffff));
            base.position.y = 2.5; base.castShadow = true;
            group.add(base);
            
            const stripeMat = getMaterial(color);
            const roof = new THREE.Mesh(new THREE.ConeGeometry(6, 4, 4), stripeMat);
            roof.position.y = 7; roof.rotation.y = Math.PI/4; roof.castShadow = true;
            group.add(roof);

            if(type === 'SHOP_ICECREAM') {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 3, 8), getMaterial(0xfde047));
                cone.rotation.z = Math.PI; cone.position.set(0, 10, 0); group.add(cone);
                const scoop = new THREE.Mesh(new THREE.SphereGeometry(1.2), getMaterial(0xfbcfe8));
                scoop.position.set(0, 11, 0); group.add(scoop);
            } else if (type === 'SHOP_BURGER') {
                const bun = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 4), getMaterial(0xf59e0b));
                bun.position.set(0, 10, 0); group.add(bun);
            } else if (type === 'SHOP_INFO') {
                const sign = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.5), getMaterial(0x3b82f6));
                sign.position.set(0, 9, 0); group.add(sign);
                const i = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2), getMaterial(0xffffff));
                i.position.set(0, 9, 0.5); group.add(i);
            }
            return group;
        }

        function createRestroom() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 8), getMaterial(0x94a3b8));
            base.position.y = 3; base.castShadow = true; group.add(base);
            const roof = new THREE.Mesh(new THREE.ConeGeometry(6, 2, 4), getMaterial(0x475569));
            roof.position.y = 7; roof.rotation.y = Math.PI/4; group.add(roof);
            const sign = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), getMaterial(0xffffff));
            sign.position.set(0, 4, 4.1); group.add(sign);
            return group;
        }

        function createPirateShip() {
            const group = new THREE.Group();
            const frameL = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1, 15), getMaterial(0x475569));
            frameL.position.set(-8, 7.5, 0); frameL.rotation.z = -0.3; group.add(frameL);
            const frameR = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1, 15), getMaterial(0x475569));
            frameR.position.set(8, 7.5, 0); frameR.rotation.z = 0.3; group.add(frameR);
            const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 18), getMaterial(0x1e293b));
            axle.rotation.z = Math.PI/2; axle.position.y = 14; group.add(axle);

            const shipGroup = new THREE.Group();
            shipGroup.position.y = 14;
            const hull = new THREE.Mesh(new THREE.CylinderGeometry(3, 2, 16, 8, 1, false, 0, Math.PI), getMaterial(0x854d0e));
            hull.rotation.z = Math.PI/2; hull.position.y = -12; shipGroup.add(hull);
            group.add(shipGroup);
            group.userData = { type: 'anim_swing', target: shipGroup, angle: 0, speed: 0.03 };
            return group;
        }

        function createUFO() {
            const group = new THREE.Group();
            // Base
            const base = new THREE.Mesh(new THREE.CylinderGeometry(8, 10, 2), getMaterial(0x374151));
            base.position.y = 1; group.add(base);
            // Spinner
            const spinner = new THREE.Group();
            const disk = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 1), getMaterial(0x10b981));
            disk.position.y = 4; spinner.add(disk);
            const dome = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16, 0, Math.PI*2, 0, Math.PI/2), getMaterial(0xd1fae5));
            dome.position.y = 4.5; spinner.add(dome);
            group.add(spinner);
            group.userData = { type: 'anim_ufo', target: spinner, angle: 0 };
            return group;
        }

        function createChairSwing() {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 15), getMaterial(0xf97316));
            pole.position.y = 7.5; group.add(pole);
            const top = new THREE.Mesh(new THREE.CylinderGeometry(8, 1, 3), getMaterial(0xfdba74));
            top.position.y = 15; group.add(top);
            
            const rotator = new THREE.Group();
            rotator.position.y = 14;
            for(let i=0; i<8; i++) {
                const angle = (i/8)*Math.PI*2;
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 10), getMaterial(0x000000));
                rope.position.set(Math.cos(angle)*6, -5, Math.sin(angle)*6);
                const chair = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), getMaterial(0xffffff));
                chair.position.y = -5;
                rope.add(chair);
                rotator.add(rope);
            }
            group.add(rotator);
            group.userData = { type: 'anim_swing_circle', target: rotator };
            return group;
        }
        
        function createCoaster() {
            const group = new THREE.Group();
            const gridW = 60, gridD = 30; 
            const trackColor = getMaterial(0x3b82f6);
            const supportColor = getMaterial(0xffffff);

            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-25, 2, 10),
                new THREE.Vector3(-25, 20, -10),
                new THREE.Vector3(0, 35, -10),
                new THREE.Vector3(25, 20, 10),
                new THREE.Vector3(25, 2, -10),
                new THREE.Vector3(0, 10, 0),
                new THREE.Vector3(-25, 2, 10) 
            ], true);

            const trackGeo = new THREE.TubeGeometry(curve, 64, 1, 8, true);
            const track = new THREE.Mesh(trackGeo, trackColor);
            group.add(track);

            const points = curve.getPoints(10);
            points.forEach(p => {
                if(p.y > 2) {
                    const h = p.y;
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, h), supportColor);
                    pillar.position.set(p.x, h/2, p.z);
                    group.add(pillar);
                }
            });

            const train = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 4), getMaterial(0xff0000));
            group.add(train);

            group.userData = { type: 'anim_path', target: train, curve: curve, progress: 0, speed: 0.0005 };
            return group;
        }

        function createTwister() {
            const group = new THREE.Group();
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 15, 2), getMaterial(0xeab308));
            arm.position.y = 7.5; 
            
            const center = new THREE.Group();
            center.add(arm);
            
            const cars = new THREE.Group();
            cars.position.y = 15;
            for(let i=0; i<4; i++) {
                const c = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), getMaterial(0x000000));
                const angle = (i/4)*Math.PI*2;
                c.position.set(Math.cos(angle)*5, 0, Math.sin(angle)*5);
                cars.add(c);
            }
            center.add(cars);
            group.add(center);
            group.userData = { type: 'anim_twist', target: center, sub: cars };
            return group;
        }

        function createCarousel() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(9, 10, 1), getMaterial(0xe2e8f0));
            base.position.y = 0.5; group.add(base);
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 8), getMaterial(0xc084fc));
            pole.position.y = 4; group.add(pole);

        // --- Interaction & Input ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isRightDown = false;
        let camTarget = new THREE.Vector3(0, 0, 0);
        let camAngle = Math.PI / 4;
        let camHeight = Math.PI / 4;
        let camZoom = 150;

        function updateCamera() {
            const hDist = camZoom * Math.cos(camHeight);
            const vDist = camZoom * Math.sin(camHeight);
            camera.position.x = camTarget.x + hDist * Math.cos(camAngle);
            camera.position.z = camTarget.z + hDist * Math.sin(camAngle);
            camera.position.y = vDist;
            camera.lookAt(camTarget);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.code === 'KeyR' && Game.selectedTool) {
                Game.rotation = (Game.rotation + 1) % 4;
                updateGhost();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const canvas = document.querySelector('canvas');
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) isRightDown = true;
            else if (e.button === 0) {
                if (Game.selectedTool) handleBuild();
                else handleSelectGuest(e);
            }
        });
        canvas.addEventListener('mouseup', () => { isRightDown = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (isRightDown) {
                camAngle -= e.movementX * 0.005;
                camHeight += e.movementY * 0.005;
                camHeight = Math.max(0.1, Math.min(Math.PI/2 - 0.1, camHeight));
                updateCamera();
            }
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length > 0 && Game.selectedTool) {
                updateGhostPosition(intersects[0].point);
            }
        });
        canvas.addEventListener('wheel', (e) => {
            camZoom += e.deltaY * 0.1;
            camZoom = Math.max(20, Math.min(600, camZoom));
            updateCamera();
        });

        function handleInput() {
            const speed = 2.0;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward); forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(); right.crossVectors(forward, camera.up);
            if (keys['KeyW']) camTarget.add(forward.multiplyScalar(speed));
            if (keys['KeyS']) camTarget.add(forward.multiplyScalar(-speed));
            if (keys['KeyA']) camTarget.add(right.multiplyScalar(-speed));
            if (keys['KeyD']) camTarget.add(right.multiplyScalar(speed));
            updateCamera();
        }

        function getToolDims() {
            if (!Game.selectedTool) return {w:1, d:1};
            let w = Game.selectedTool.w || 1;
            let d = Game.selectedTool.d || 1;
            if (Game.rotation % 2 !== 0) return { w: d, d: w };
            return { w, d };
        }

        function updateGhost() {
            if (!Game.selectedTool) return;
            const dims = getToolDims();
            highlightMesh.scale.set(dims.w * Game.tileSize, 1, dims.d * Game.tileSize);
            highlightMesh.rotation.y = -Game.rotation * (Math.PI / 2);
        }

        function updateGhostPosition(point) {
            const dims = getToolDims();
            const gx = Math.round(point.x / Game.tileSize) * Game.tileSize;
            const gz = Math.round(point.z / Game.tileSize) * Game.tileSize;
            
            let finalX = gx;
            let finalZ = gz;
            if (dims.w % 2 === 0) finalX += Game.tileSize / 2;
            if (dims.d % 2 === 0) finalZ += Game.tileSize / 2;

            highlightMesh.position.set(finalX, 0.5, finalZ);
            highlightMesh.visible = true;
            
            const isValid = checkCollision(gx, gz, dims.w, dims.d);
            highlightMesh.material.color.setHex(isValid ? 0x4ade80 : 0xef4444);
        }

        function checkCollision(anchorX, anchorZ, w, d) {
            const startX = Math.round(highlightMesh.position.x / Game.tileSize - w/2 + 0.5);
            const startZ = Math.round(highlightMesh.position.z / Game.tileSize - d/2 + 0.5);
            
            for(let i=0; i<w; i++) {
                for(let j=0; j<d; j++) {
                    const tx = (startX + i) * Game.tileSize;
                    const tz = (startZ + j) * Game.tileSize;
                    const key = `${tx},${tz}`;
                    if(Game.buildings[key]) return false;
                }
            }
            return true;
        }

        function handleBuild() {
            if (!highlightMesh.visible) return;
            const dims = getToolDims();
            const startX = Math.round(highlightMesh.position.x / Game.tileSize - dims.w/2 + 0.5);
            const startZ = Math.round(highlightMesh.position.z / Game.tileSize - dims.d/2 + 0.5);
            
            if(!checkCollision(0,0, dims.w, dims.d)) {
                showNotification("Blocked!", "error");
                return;
            }
            if (Game.money < Game.selectedTool.cost) {
                showNotification("Funds low!", "error");
                return;
            }

            updateMoney(-Game.selectedTool.cost);
            let mesh = createAsset(Game.selectedTool.id, Game.selectedTool.type);
            
            if(!mesh) {
                // Generic Fallback
                if(Game.selectedTool.id === 'path') {
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), getMaterial(0x78716c));
                    mesh.receiveShadow = true;
                } else if(Game.selectedTool.id === 'scenery_bench') {
                     mesh = new THREE.Group();
                     const seat = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 2), getMaterial(0x92400e)); seat.position.y=1; mesh.add(seat);
                     const back = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 0.5), getMaterial(0x92400e)); back.position.set(0,2,-1); mesh.add(back);
                } else {
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(dims.w*8, dims.d*8, dims.w*8), getMaterial(Game.selectedTool.color));
                    mesh.position.y = 5;
                }
            }

            mesh.position.set(highlightMesh.position.x, 0, highlightMesh.position.z);
            mesh.rotation.y = -Game.rotation * (Math.PI / 2);
            scene.add(mesh);
            spawnParticles(mesh.position.x, 5, mesh.position.z, 0xffffff);

            const buildingRef = {
                id: Game.selectedTool.id,
                type: Game.selectedTool.type,
                mesh: mesh,
                data: Game.selectedTool,
                entrance: { x: startX*Game.tileSize, z: startZ*Game.tileSize } 
            };

            for(let i=0; i<dims.w; i++) {
                for(let j=0; j<dims.d; j++) {
                    const tx = (startX + i) * Game.tileSize;
                    const tz = (startZ + j) * Game.tileSize;
                    Game.buildings[`${tx},${tz}`] = buildingRef;
                }
            }
            showNotification(`Built ${Game.selectedTool.name}`, "success");
        }

        // --- Guest System ---
        const GUEST_NAMES = ["Alice", "Bob", "Charlie", "Diana", "Evan", "Fiona", "George", "Hannah", "Ian", "Jane"];
        const THOUGHTS = ["I'm hungry", "This park is great!", "Where is the bathroom?", "I feel sick...", "What a ride!", "Need coffee", "So fun!", "I'm broke...", "Wow!"];

        class Guest {
            constructor() {
                this.mesh = new THREE.Group();
                const color = Math.random() > 0.5 ? 0x3b82f6 : 0xef4444;
                const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 1.5, 4, 8), getMaterial(color));
                body.position.y = 1.25; body.castShadow = true;
                this.mesh.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), getMaterial(0xffd1dc));
                head.position.y = 2.5; this.mesh.add(head);

                this.name = GUEST_NAMES[Math.floor(Math.random()*GUEST_NAMES.length)];
                this.thought = "Just arrived!";
                this.happiness = 100;
                this.money = 50 + Math.floor(Math.random()*100);
                this.x = Game.entrance.x; 
                this.z = Game.entrance.z;
                this.mesh.position.set(this.x, 0, this.z);
                scene.add(this.mesh);
                this.target = null;
                this.state = 'idle';
            }

            update(dt) {
                if(this.state === 'riding') return;

                if (!this.target) this.pickNextPath();

                if (this.target) {
                    const speed = 15 * dt;
                    const dx = this.target.x - this.x;
                    const dz = this.target.z - this.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    
                    if (dist < 0.5) {
                        this.x = this.target.x;
                        this.z = this.target.z;
                        this.target = null;
                        this.interact();
                    } else {
                        this.x += (dx / dist) * speed;
                        this.z += (dz / dist) * speed;
                        this.mesh.lookAt(this.target.x, this.mesh.position.y, this.target.z);
                    }
                    this.mesh.position.set(this.x, 0, this.z);
                    this.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.015)) * 0.2;
                }
            }

            pickNextPath() {
                const moves = [
                    {x:this.x+Game.tileSize, z:this.z},
                    {x:this.x-Game.tileSize, z:this.z},
                    {x:this.x, z:this.z+Game.tileSize},
                    {x:this.x, z:this.z-Game.tileSize}
                ];
                const valid = moves.filter(m => {
                    const b = Game.buildings[`${Math.round(m.x)},${Math.round(m.z)}`];
                    return b && (b.type === 'infrastructure');
                });
                if(valid.length > 0) this.target = valid[Math.floor(Math.random() * valid.length)];
                else this.thought = "I'm stuck!";
            }

            interact() {
                const moves = [
                    {x:this.x+Game.tileSize, z:this.z},
                    {x:this.x-Game.tileSize, z:this.z},
                    {x:this.x, z:this.z+Game.tileSize},
                    {x:this.x, z:this.z-Game.tileSize}
                ];
                
                for(let m of moves) {
                    const b = Game.buildings[`${Math.round(m.x)},${Math.round(m.z)}`];
                    if(b) {
                        if(b.type === 'ride' && this.money >= b.data.ticketPrice) {
                             if(Math.random() < 0.1) { this.enterRide(b); return; }
                        } else if(b.type === 'shop' && this.money >= 10) {
                            if(Math.random() < 0.05) { this.buy(b); return; }
                        }
                    }
                }
                if(Math.random() < 0.01) this.thought = THOUGHTS[Math.floor(Math.random()*THOUGHTS.length)];
            }

            enterRide(ride) {
                this.state = 'riding';
                this.mesh.visible = false;
                updateMoney(ride.data.ticketPrice);
                this.money -= ride.data.ticketPrice;
                this.thought = `Riding ${ride.data.name}!`;
                spawnFloatingText(`$${ride.data.ticketPrice}`, this.x, 5, this.z, '#22c55e');
                setTimeout(() => {
                    this.state = 'idle';
                    this.mesh.visible = true;
                    this.happiness = Math.min(100, this.happiness + 20);
                    this.thought = "That was awesome!";
                }, 4000);
            }
            buy(shop) {
                 updateMoney(shop.data.income);
                 this.money -= shop.data.income;
                 this.thought = "Yummy!";
                 spawnFloatingText(`$${shop.data.income}`, this.x, 5, this.z, '#fbbf24');
            }
        }

        function handleSelectGuest(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Game.guests.map(g=>g.mesh), true);
            if(intersects.length > 0) {
                const hitRoot = intersects[0].object.parent;
                const guest = Game.guests.find(g => g.mesh === hitRoot);
                if(guest) {
                    Game.selectedGuest = guest;
                    updateInspector();
                    document.getElementById('guest-inspector').classList.remove('hidden');
                    const rect = document.getElementById('guest-inspector').getBoundingClientRect();
                    document.getElementById('guest-inspector').style.left = e.clientX + 'px';
                    document.getElementById('guest-inspector').style.top = (e.clientY - rect.height - 10) + 'px';
                }
            } else {
                document.getElementById('guest-inspector').classList.add('hidden');
                Game.selectedGuest = null;
            }
        }

        function updateInspector() {
            if(!Game.selectedGuest) return;
            const g = Game.selectedGuest;
            document.getElementById('gi-name').innerText = g.name;
            document.getElementById('gi-thought').innerText = `"${g.thought}"`;
            document.getElementById('gi-cash').innerText = '$' + Math.floor(g.money);
            document.getElementById('gi-happy').innerText = Math.floor(g.happiness) + '%';
        }

        // --- Loop ---
        const particles = [];
        function spawnParticles(x, y, z, color) {
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), getMaterial(color));
                p.position.set(x + (Math.random()-0.5)*2, y, z + (Math.random()-0.5)*2);
                p.userData = { vy: 0.2+Math.random()*0.3, life: 1.0 };
                scene.add(p);
                particles.push(p);
            }
        }

        const floatingTexts = [];
        function spawnFloatingText(txt, x, y, z, c) {
            const el = document.createElement('div');
            el.innerText = txt;
            el.style.position = 'absolute';
            el.style.color = c;
            el.style.fontWeight = '900';
            el.style.textShadow = '0 2px 4px rgba(0,0,0,0.8)';
            el.style.pointerEvents='none';
            document.body.appendChild(el);
            floatingTexts.push({el, pos: new THREE.Vector3(x,y,z), life:1.5});
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            handleInput();

            Game.guests.forEach(g => g.update(dt));
            if(Game.tick % 100 === 0 && Game.guests.length < 100) {
                Game.guests.push(new Guest());
                document.getElementById('guest-count').innerText = Game.guests.length;
            }

            for(let key in Game.buildings) {
                const b = Game.buildings[key];
                if(b.updatedTick === Game.tick) continue;
                b.updatedTick = Game.tick;
                
                if(b.mesh.userData.type === 'anim_fountain') {
                    if(Math.random() > 0.8) spawnParticles(b.mesh.position.x, 3, b.mesh.position.z, 0x3b82f6);
                } else if(b.mesh.userData.type === 'anim_swing') {
                    b.mesh.userData.angle += dt * 2;
                    b.mesh.userData.target.rotation.x = Math.sin(b.mesh.userData.angle) * 0.8;
                } else if(b.mesh.userData.type === 'anim_rotate_y') {
                    b.mesh.userData.target.rotation.y += dt;
                } else if(b.mesh.userData.type === 'anim_ufo') {
                    b.mesh.userData.angle += dt * 3;
                    b.mesh.userData.target.rotation.y += dt * 2;
                    b.mesh.userData.target.position.y = 4 + Math.sin(b.mesh.userData.angle)*0.5;
                } else if(b.mesh.userData.type === 'anim_swing_circle') {
                    b.mesh.userData.target.rotation.y += dt;
                    b.mesh.userData.target.children.forEach(c => c.rotation.x = 0.5); // Flare out
                } else if(b.mesh.userData.type === 'anim_twist') {
                    b.mesh.userData.target.rotation.y += dt*2;
                    b.mesh.userData.sub.rotation.x += dt*3;
                } else if(b.mesh.userData.type === 'anim_path') {
                    const d = b.mesh.userData;
                    d.progress += dt * 0.2;
                    if(d.progress > 1) d.progress = 0;
                    const pos = d.curve.getPointAt(d.progress);
                    const tan = d.curve.getTangentAt(d.progress);
                    d.target.position.copy(pos);
                    d.target.lookAt(pos.clone().add(tan));
                } else if(b.mesh.userData.type === 'anim_rotate_z') { // FERRIS WHEEL
                    b.mesh.userData.target.rotation.z += b.mesh.userData.speed;
                    // Counter rotate cabins
                    b.mesh.userData.target.children.forEach(c => {
                         if(c.userData.isCabin) c.rotation.z = -b.mesh.userData.target.rotation.z;
                    });
                } else if(b.mesh.userData.type === 'anim_drop') { // DROP TOWER
                    const d = b.mesh.userData;
                    if(d.state === 'wait') {
                        d.timer += dt;
                        if(d.timer > 3) { d.state = 'up'; d.timer = 0; }
                    } else if(d.state === 'up') {
                        d.target.position.y += dt * 5;
                        if(d.target.position.y > 25) { d.state = 'hang'; d.target.position.y = 25; }
                    } else if(d.state === 'hang') {
                        d.timer += dt;
                        if(d.timer > 1) d.state = 'drop';
                    } else if(d.state === 'drop') {
                        d.target.position.y -= dt * 40;
                        if(d.target.position.y < 2) { 
                            d.target.position.y = 2; 
                            d.state = 'wait';
                            spawnParticles(b.mesh.position.x, 2, b.mesh.position.z, 0xffffff);
                        }
                    }
                }
            }

            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.position.y += p.userData.vy;
                p.userData.life -= dt;
                p.scale.multiplyScalar(0.95);
                if(p.userData.life <= 0) { scene.remove(p); particles.splice(i,1); }
            }

            floatingTexts.forEach((ft, i) => {
                ft.life -= dt;
                ft.pos.y += dt*5;
                const v = ft.pos.clone().project(camera);
                const x = (v.x * .5 + .5) * window.innerWidth;
                const y = (-(v.y * .5) + .5) * window.innerHeight;
                ft.el.style.left = x + 'px';
                ft.el.style.top = y + 'px';
                ft.el.style.opacity = ft.life;
                if(ft.life <= 0) { ft.el.remove(); floatingTexts[i] = null; }
            });
            while(floatingTexts.includes(null)) floatingTexts.splice(floatingTexts.indexOf(null), 1);

            if(Game.tick % 30 === 0) updateInspector();
            Game.tick++;
            renderer.render(scene, camera);
        }

        function filterToolbar(cat) {
            Game.filter = cat;

        function renderToolbar() {
            const toolbar = document.getElementById('toolbar');
            toolbar.innerHTML = '';
            for(let k in BUILDING_TYPES) {
                const t = BUILDING_TYPES[k];
                if(Game.filter !== 'all' && t.category !== Game.filter) continue;
                
                const d = document.createElement('div');
                d.className = 'item-card flex flex-col items-center justify-center w-24 h-24 bg-slate-800 rounded-lg shrink-0';
                d.innerHTML = `<div class="text-3xl">${t.icon}</div><div class="text-[10px] font-bold mt-1 text-center leading-3">${t.name}</div><div class="text-xs text-emerald-400">$${t.cost}</div>`;
                d.onclick = () => {
                    Game.selectedTool = t;
                    Game.rotation = 0;
                    document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('active'));
                    d.classList.add('active');
                    updateGhost();
                }
                toolbar.appendChild(d);
            }
        }

        function init() {
            renderToolbar();

            // Initial Path
            const ex = Game.entrance.x;
            const ez = Game.entrance.z;
            for(let i=0; i<5; i++) {
                const z = ez - (i*10);
                const key = `${ex},${z}`;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), getMaterial(0x78716c));
                mesh.position.set(ex, 0.1, z);
                scene.add(mesh);
                Game.buildings[key] = { type:'infrastructure', id:'path', mesh:mesh };
            }
            // Gate
            const gate = new THREE.Group();
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(2,10,2), getMaterial(0xffffff)); p1.position.set(-6,5,0);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(2,10,2), getMaterial(0xffffff)); p2.position.set(6,5,0);
            const top = new THREE.Mesh(new THREE.BoxGeometry(14,2,2), getMaterial(0x3b82f6)); top.position.set(0,9,0);
            gate.add(p1); gate.add(p2); gate.add(top);
            gate.position.set(ex, 0, ez+5);
            scene.add(gate);

            animate();
        }

        function updateMoney(v) {
            Game.money += v;
            document.getElementById('money-display').innerText = Game.money.toLocaleString();
        }

        function showNotification(msg, type) {
            const n = document.createElement('div');
            n.className = `p-2 px-4 rounded shadow mb-2 text-white font-bold text-sm transform transition-all duration-500 translate-x-10 opacity-0`;
            n.style.background = type === 'error' ? '#ef4444' : '#10b981';
            n.innerText = msg;
            document.getElementById('notifications').appendChild(n);
            setTimeout(()=>n.classList.remove('translate-x-10', 'opacity-0'), 10);
            setTimeout(()=>{
                n.classList.add('opacity-0');
                setTimeout(()=>n.remove(), 500);
            }, 2000);
        }

        init();
    </script>
</body>
</html>
