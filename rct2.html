<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ThrillEngine 3D | Theme Park Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; outline: none; }
        
        .ui-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .item-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
        .item-card:active { transform: scale(0.95); }
        .item-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        
        .category-tab {
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .category-tab:hover { color: white; background: rgba(255,255,255,0.1); }
        .category-tab.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        #inspector-panel { pointer-events: none; transition: opacity 0.2s; }
        .inspector-content { pointer-events: auto !important; }
        
        .scroller::-webkit-scrollbar { height: 6px; }
        .scroller::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        #save-menu { transition: opacity 0.3s; }
        #save-menu.hidden { opacity: 0; pointer-events: none; }
        
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 32px; height: 32px; padding: 0; overflow: hidden; border-radius: 50%; cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-20">
        <div class="ui-panel px-6 py-3 rounded-xl pointer-events-auto flex items-center gap-6">
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Funds</div>
                <div class="text-2xl font-bold text-emerald-400">$<span id="money-display">10,000</span></div>
            </div>
            <div class="h-8 w-px bg-slate-600"></div>
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Guests</div>
                <div class="text-2xl font-bold text-blue-400"><span id="guest-count">0</span></div>
            </div>
             <div class="h-8 w-px bg-slate-600"></div>
            <div>
                <div class="text-xs text-slate-400 uppercase tracking-wider font-bold">Rating</div>
                <div class="text-2xl font-bold text-amber-400"><span id="rating-display">500</span></div>
            </div>
        </div>

        <div class="flex gap-2 pointer-events-auto">
            <button onclick="toggleSaveMenu()" class="ui-panel w-12 h-12 rounded-xl flex items-center justify-center text-2xl hover:bg-slate-700 transition">💾</button>
            <div class="ui-panel px-4 py-2 rounded-xl text-right">
                <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent italic">ThrillEngine 3D</h1>
                <p class="text-xs text-slate-400">Platinum Edition</p>
            </div>
        </div>
    </div>

    <!-- Save/Load Modal -->
    <div id="save-menu" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0">
        <div class="ui-panel p-6 rounded-2xl w-full max-w-md pointer-events-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Save & Load</h2>
                <button onclick="toggleSaveMenu()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-3" id="save-slots"></div>
        </div>
    </div>

    <div id="notifications" class="fixed top-24 right-4 flex flex-col gap-2 pointer-events-none z-20 w-64"></div>

    <!-- Unified Inspector -->
    <div id="inspector-panel" class="fixed hidden z-30 ui-panel p-4 rounded-xl w-64 shadow-2xl border-l-4 border-blue-500 inspector-content">
        <!-- Guest View -->
        <div id="insp-guest" class="hidden">
            <h3 class="font-bold text-lg mb-1" id="gi-name">Guest</h3>
            <div class="text-sm text-slate-300 mb-3 italic" id="gi-thought">"..."</div>
            <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                <div class="bg-slate-800 p-1 rounded text-center"><span class="block text-slate-400">Cash</span><span class="text-emerald-400" id="gi-cash">$0</span></div>
                <div class="bg-slate-800 p-1 rounded text-center"><span class="block text-slate-400">Happy</span><span class="text-amber-400" id="gi-happy">0%</span></div>
            </div>
        </div>
        <!-- Building View -->
        <div id="insp-building" class="hidden">
            <h3 class="font-bold text-lg mb-1" id="bi-name">Building</h3>
            <div class="text-xs text-slate-400 mb-2 uppercase tracking-wide">Customization</div>
            <div class="flex items-center justify-between bg-slate-800 p-2 rounded">
                <span class="text-sm font-bold">Paint Color</span>
                <input type="color" id="bi-color" oninput="updateBuildingColor(this.value)" onchange="updateBuildingColor(this.value)">
            </div>
            <div class="mt-3 text-xs text-slate-400 text-center">Ticket Price: Fixed</div>
        </div>
    </div>

    <!-- Bottom Toolbar -->
    <div class="fixed bottom-0 left-0 w-full flex flex-col items-center pointer-events-none z-20 pb-4">
        <div class="ui-panel mb-2 rounded-lg flex gap-1 pointer-events-auto p-1">
            <div class="category-tab active" onclick="filterToolbar('all')">All</div>
            <div class="category-tab" onclick="filterToolbar('infra')">Paths</div>
            <div class="category-tab" onclick="filterToolbar('ride')">Rides</div>
            <div class="category-tab" onclick="filterToolbar('shop')">Shops</div>
            <div class="category-tab" onclick="filterToolbar('scenery')">Scenery</div>
            <div class="category-tab" onclick="filterToolbar('terrain')">Terrain</div>
        </div>
        
        <div class="ui-panel p-2 rounded-2xl pointer-events-auto flex gap-2 overflow-x-auto scroller max-w-[90vw]">
            <div id="toolbar" class="flex gap-2"></div>
        </div>
    </div>

    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full bg-slate-900 cursor-crosshair"></div>

    <script>
        const Game = {
            money: 10000,
            guests: [],
            buildings: {}, 
            gridSize: 60,
            tileSize: 10,
            tick: 0,
            selectedTool: null, 
            rotation: 0, 
            entrance: { x: 0, z: 280 },
            selectedGuest: null,
            selectedBuilding: null,
            filter: 'all'
        };

        const BUILDING_TYPES = {
            TOOL_WATER: { id: 'tool_water', name: 'Water', cost: 20, color: '#3b82f6', icon: '💧', type: 'scenery', category: 'terrain', w:1, d:1 },

            PATH: { id: 'path', name: 'Path', cost: 10, color: '#78716c', icon: '🛣️', type: 'infrastructure', w:1, d:1, category: 'infra' },
            QUEUE: { id: 'queue', name: 'Queue Path', cost: 15, color: '#60a5fa', icon: '🛂', type: 'infrastructure', w:1, d:1, category: 'infra' },
            ENTRANCE: { id: 'entrance', name: 'Entrance', cost: 50, color: '#22c55e', icon: '🟩', type: 'connector', w:1, d:1, category: 'infra' },
            EXIT: { id: 'exit', name: 'Exit', cost: 50, color: '#ef4444', icon: '🟥', type: 'connector', w:1, d:1, category: 'infra' },
            
            RIDE_COASTER: { id: 'ride_coaster', name: 'The Titan', cost: 5000, color: '#3b82f6', icon: '🎢', type: 'ride', ticketPrice: 15, excitement: 90, w:6, d:3, category: 'ride' },
            RIDE_HYPER: { id: 'ride_hyper', name: 'Hyper Coaster', cost: 6000, color: '#ef4444', icon: '🚄', type: 'ride', ticketPrice: 20, excitement: 95, w:8, d:4, category: 'ride' },
            RIDE_MINE: { id: 'ride_mine', name: 'Mine Train', cost: 4500, color: '#92400e', icon: '🚂', type: 'ride', ticketPrice: 12, excitement: 80, w:5, d:3, category: 'ride' },
            RIDE_PIRATE: { id: 'ride_pirate', name: 'Pirate Ship', cost: 1500, color: '#854d0e', icon: '🏴‍☠️', type: 'ride', ticketPrice: 8, excitement: 55, w:3, d:1, category: 'ride' },
            RIDE_FERRIS: { id: 'ride_ferris', name: 'Ferris Wheel', cost: 1200, color: '#ef4444', icon: '🎡', type: 'ride', ticketPrice: 6, excitement: 40, w:1, d:1, category: 'ride' },
            RIDE_DROP: { id: 'ride_drop', name: 'Drop Tower', cost: 2000, color: '#8b5cf6', icon: '🗼', type: 'ride', ticketPrice: 10, excitement: 75, w:1, d:1, category: 'ride' },
            RIDE_CAROUSEL: { id: 'ride_carousel', name: 'Carousel', cost: 1000, color: '#ec4899', icon: '🎠', type: 'ride', ticketPrice: 5, excitement: 30, w:2, d:2, category: 'ride' },
            RIDE_TEACUP: { id: 'ride_teacup', name: 'Tea Cups', cost: 800, color: '#d946ef', icon: '☕', type: 'ride', ticketPrice: 4, excitement: 25, w:2, d:2, category: 'ride' },
            RIDE_UFO: { id: 'ride_ufo', name: 'U.F.O', cost: 1800, color: '#10b981', icon: '🛸', type: 'ride', ticketPrice: 9, excitement: 60, w:2, d:2, category: 'ride' },
            RIDE_CHAIRSWING: { id: 'ride_chairswing', name: 'Chair Swing', cost: 1100, color: '#f97316', icon: '🎪', type: 'ride', ticketPrice: 5, excitement: 35, w:2, d:2, category: 'ride' },
            RIDE_TWISTER: { id: 'ride_twister', name: 'Twister', cost: 1400, color: '#eab308', icon: '🌪️', type: 'ride', ticketPrice: 7, excitement: 50, w:1, d:1, category: 'ride' },

            SHOP_BURGER: { id: 'shop_burger', name: 'Burger Stall', cost: 300, color: '#f59e0b', icon: '🍔', type: 'shop', income: 15, w:1, d:1, category: 'shop' },
            SHOP_ICECREAM: { id: 'shop_icecream', name: 'Ice Cream', cost: 250, color: '#fbcfe8', icon: '🍦', type: 'shop', income: 8, w:1, d:1, category: 'shop' },
            SHOP_HOTDOG: { id: 'shop_hotdog', name: 'Hot Dog', cost: 200, color: '#ef4444', icon: '🌭', type: 'shop', income: 6, w:1, d:1, category: 'shop' },
            SHOP_INFO: { id: 'shop_info', name: 'Info Kiosk', cost: 150, color: '#3b82f6', icon: 'ℹ️', type: 'shop', income: 2, w:1, d:1, category: 'shop' },
            FACILITY_RESTROOM: { id: 'facility_restroom', name: 'Restroom', cost: 400, color: '#94a3b8', icon: '🚻', type: 'facility', w:1, d:1, category: 'shop' },
            FACILITY_ATM: { id: 'facility_atm', name: 'ATM', cost: 200, color: '#64748b', icon: '🏧', type: 'facility', w:1, d:1, category: 'shop' },

            SCENERY_FOUNTAIN: { id: 'scenery_fountain', name: 'Fountain', cost: 150, color: '#60a5fa', icon: '⛲', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_TREE: { id: 'scenery_tree', name: 'Oak Tree', cost: 50, color: '#22c55e', icon: '🌳', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_BUSH: { id: 'scenery_bush', name: 'Hedge', cost: 20, color: '#166534', icon: '🌿', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_MAZE: { id: 'scenery_maze', name: 'Box Hedge', cost: 30, color: '#14532d', icon: '🟩', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_PLANTER: { id: 'scenery_planter', name: 'Planter', cost: 25, color: '#78350f', icon: '🪴', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_FLOWER: { id: 'scenery_flower', name: 'Flowers', cost: 15, color: '#f43f5e', icon: '🌺', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_ROCK: { id: 'scenery_rock', name: 'Large Rock', cost: 30, color: '#57534e', icon: '🪨', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_LAMP: { id: 'scenery_lamp', name: 'Lamp Post', cost: 25, color: '#fde047', icon: '💡', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_BENCH: { id: 'scenery_bench', name: 'Bench', cost: 15, color: '#92400e', icon: '🪑', type: 'scenery', w:1, d:1, category: 'scenery' },
            SCENERY_TRASH: { id: 'scenery_trash', name: 'Trash Can', cost: 10, color: '#4b5563', icon: '🗑️', type: 'scenery', w:1, d:1, category: 'scenery' },
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 100, 900);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(200, 200, 200);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(150, 300, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.bias = -0.0005;
        const d = 400;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // GROUND
        const mapSize = 600; 
        const groundGeo = new THREE.PlaneGeometry(600, 600);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(600, 60, 0xffffff, 0xffffff);
        gridHelper.material.opacity = 0.1;
        gridHelper.material.transparent = true;
        gridHelper.position.set(0, 0.1, 0);
        scene.add(gridHelper);

        const highlightMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5 })
        );
        highlightMesh.visible = false;
        scene.add(highlightMesh);

        function getMaterial(color) { return new THREE.MeshStandardMaterial({ color: color }); }

        function createBase(w, d) {
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(w * 10 - 0.5, 0.4, d * 10 - 0.5),
                getMaterial(0x9ca3af)
            );
            base.position.y = 0.2;
            base.receiveShadow = true;
            return base;
        }

        // --- ASSETS ---
        function createEntrance() {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 4), getMaterial(0xe2b680)); // Tan
            b.position.y = 2.5; b.castShadow = true; g.add(b);
            const r = new THREE.Mesh(new THREE.ConeGeometry(6, 3, 4), getMaterial(0xef4444)); // Red Roof
            r.position.y = 6.5; r.rotation.y = Math.PI/4; r.castShadow = true; g.add(r);
            const door = new THREE.Mesh(new THREE.PlaneGeometry(2, 4), getMaterial(0x333333));
            door.position.set(0, 2, 2.1); g.add(door);
            const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4), getMaterial(0x22c55e)); // Green Tube
            t.rotation.z = Math.PI/2; t.position.y = 8; g.add(t);
            // Allow roof painting
            g.userData = { paint: [r.material] };
            return g;
        }

        function createExit() {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 4), getMaterial(0xe2b680)); // Tan
            b.position.y = 2.5; b.castShadow = true; g.add(b);
            const r = new THREE.Mesh(new THREE.ConeGeometry(6, 3, 4), getMaterial(0xef4444)); // Red Roof
            r.position.y = 6.5; r.rotation.y = Math.PI/4; r.castShadow = true; g.add(r);
            const door = new THREE.Mesh(new THREE.PlaneGeometry(2, 4), getMaterial(0x333333));
            door.position.set(0, 2, 2.1); g.add(door);
            const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4), getMaterial(0xef4444)); // Red Tube
            t.rotation.z = Math.PI/2; t.position.y = 8; g.add(t);
            // Allow roof painting
            g.userData = { paint: [r.material] };
            return g;
        }

        function createTeaCups(paintColor) {
            const g = new THREE.Group();
            g.add(createBase(2, 2)); 
            // Reduced size for 2x2 tile fit
            const p = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 1), getMaterial(0xf472b6)); 
            p.position.y = 1; g.add(p);
            const r = new THREE.Group(); r.position.y = 1.5;
            for(let i=0; i<3; i++) {
                const c = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.0, 1.5), getMaterial(paintColor));
                const a = (i/3)*Math.PI*2; 
                c.position.set(Math.cos(a)*4.5, 0.75, Math.sin(a)*4.5); 
                r.add(c);
            }
            g.add(r);
            g.userData = { type: 'anim_rotate_y', target: r, speed: 0.02, paint: [p.material, ...r.children.map(c=>c.material)] };
            return g;
        }

        function createChairSwing(paintColor) {
            const g = new THREE.Group();
            g.add(createBase(2, 2));
            const p = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 15), getMaterial(paintColor)); 
            p.position.y = 7.5; g.add(p);
            const t = new THREE.Mesh(new THREE.CylinderGeometry(8, 1, 3), getMaterial(0xfdba74)); 
            t.position.y = 15; g.add(t);
            const r = new THREE.Group(); r.position.y = 14;
            for(let i=0; i<8; i++) {
                const swingGroup = new THREE.Group();
                const a = (i/8)*Math.PI*2;
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 10), getMaterial(0x000000));
                rope.geometry.translate(0, -5, 0); 
                swingGroup.position.set(Math.cos(a)*6, 0, Math.sin(a)*6);
                swingGroup.rotation.y = a; 
                const c = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), getMaterial(0xffffff)); 
                c.position.y = -10; 
                rope.add(c);
                swingGroup.add(rope);
                swingGroup.userData = { isSwing: true, rope: rope }; 
                r.add(swingGroup);
            }
            g.add(r);
            g.userData = { type: 'anim_swing_circle', target: r, paint: [p.material] };
            return g;
        }

        function createTwister(paintColor) {
            const g = new THREE.Group();
            g.add(createBase(1, 1));
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 2), getMaterial(paintColor)); 
            arm.position.y = 0; 
            const c = new THREE.Group(); 
            c.position.y = 8; c.add(arm);
            const cars = new THREE.Group(); 
            cars.position.y = 6; 
            for(let i=0; i<4; i++) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), getMaterial(0x000000));
                const a = (i/4)*Math.PI*2;
                box.position.set(Math.cos(a)*5, 0, Math.sin(a)*5); 
                cars.add(box);
            }
            c.add(cars); g.add(c);
            g.userData = { type: 'anim_twist', target: c, sub: cars, paint: [arm.material] };
            return g;
        }

        function createWaterTile() {
            const g = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({color: 0x3b82f6, roughness: 0.1}));
            g.geometry.translate(0, 0, 0.2); 
            g.rotation.x = -Math.PI/2;
            return g;
        }

        function createTree() { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 3, 6), getMaterial(0x5d4037)); t.position.y=1.5; g.add(t); const l = new THREE.Mesh(new THREE.ConeGeometry(3.5, 7, 8), getMaterial(0x15803d)); l.position.y=5; g.add(l); return g; }
        function createLamp() { const g = new THREE.Group(); const p = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), getMaterial(0x1e293b)); p.position.y=4; g.add(p); const b = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), getMaterial(0xfde047)); b.position.y=8; g.add(b); return g; }
        function createTrash() { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.CylinderGeometry(1,0.8,2.5), getMaterial(0x4b5563)); c.position.y=1.25; g.add(c); return g; }
        function createBush() { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.DodecahedronGeometry(2), getMaterial(0x166534)); b.position.y=1.5; g.add(b); return g; }
        function createMaze() { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(10,4,10), getMaterial(0x14532d)); b.position.y=2; g.add(b); return g; }
        function createPlanter() { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(6,1.5,6), getMaterial(0x78350f)); b.position.y=0.75; g.add(b); const l = new THREE.Mesh(new THREE.BoxGeometry(5,0.5,5), getMaterial(0x22c55e)); l.position.y=1.6; g.add(l); return g; }

            if(id === 'ride_drop') return createDropTower(c);

            if(id === 'tool_water') return createWaterTile();

            if(id === 'scenery_fountain') return createFountain();
            if(id === 'scenery_tree') return createTree();
            if(id === 'scenery_bush') return createBush();
            if(id === 'scenery_maze') return createMaze();
            if(id === 'scenery_planter') return createPlanter();

            if(id === 'facility_restroom') return createRestroom();

            if(id === 'entrance') return createEntrance();
            if(id === 'exit') return createExit();

        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isRightDown = false;
        let camTarget = new THREE.Vector3(0, 0, 0);
        let camAngle = Math.PI / 4;
        let camHeight = Math.PI / 4;
        let camZoom = 150;

        function updateCamera() {
            const hDist = camZoom * Math.cos(camHeight);
            const vDist = camZoom * Math.sin(camHeight);
            camera.position.x = camTarget.x + hDist * Math.cos(camAngle);
            camera.position.z = camTarget.z + hDist * Math.sin(camAngle);
            camera.position.y = vDist;
            camera.lookAt(camTarget);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; if(e.code === 'KeyR' && Game.selectedTool) { Game.rotation = (Game.rotation + 1) % 4; updateGhost(); } });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const canvas = document.querySelector('canvas');
        canvas.addEventListener('mousedown', (e) => {
            if(e.target.closest('.ui-panel') || e.target.closest('button') || e.target.tagName === 'INPUT') return;
            if (e.button === 2) isRightDown = true;
            else if (e.button === 0) {
                if(!document.getElementById('save-menu').classList.contains('hidden')) return;
                
                if (Game.selectedTool) {
                    if (Game.selectedTool.id === 'bulldoze') handleBulldoze();
                    else handleBuild();
                } else handleSelection(e);
            }
        });
        canvas.addEventListener('mouseup', () => { isRightDown = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (isRightDown) { camAngle -= e.movementX * 0.005; camHeight += e.movementY * 0.005; camHeight = Math.max(0.1, Math.min(Math.PI/2 - 0.1, camHeight)); updateCamera(); }
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length > 0 && Game.selectedTool) updateGhostPosition(intersects[0].point);
        });
        canvas.addEventListener('wheel', (e) => { camZoom += e.deltaY * 0.1; camZoom = Math.max(20, Math.min(600, camZoom)); updateCamera(); });

        function handleInput() {
            const speed = 2.0; const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize(); const r = new THREE.Vector3(); r.crossVectors(f, camera.up);
            if (keys['KeyW']) camTarget.add(f.multiplyScalar(speed)); if (keys['KeyS']) camTarget.add(f.multiplyScalar(-speed));
            if (keys['KeyA']) camTarget.add(r.multiplyScalar(-speed)); if (keys['KeyD']) camTarget.add(r.multiplyScalar(speed));
            updateCamera();
        }

        function getToolDims() {
            if (!Game.selectedTool) return {w:1, d:1};
            let w = Game.selectedTool.w || 1; let d = Game.selectedTool.d || 1;
            if (Game.rotation % 2 !== 0) return { w: d, d: w };
            return { w, d };
        }

        function updateGhost() {
            if (!Game.selectedTool) return;
            const dims = getToolDims();
            highlightMesh.scale.set(dims.w * Game.tileSize, 1, dims.d * Game.tileSize);
            highlightMesh.rotation.y = -Game.rotation * (Math.PI / 2);
        }

        function updateGhostPosition(point) {
            const gx = Math.round(point.x / Game.tileSize) * Game.tileSize; const gz = Math.round(point.z / Game.tileSize) * Game.tileSize;
            
            // Special Tools
            if (Game.selectedTool.id === 'bulldoze') {
                highlightMesh.scale.set(Game.tileSize, 1, Game.tileSize); highlightMesh.position.set(gx, 0.5, gz); highlightMesh.visible = true;
                highlightMesh.material.color.setHex(Game.buildings[`${gx},${gz}`] ? 0xef4444 : 0x94a3b8);
                return;
            }

            const dims = getToolDims();
            let finalX = gx; let finalZ = gz;
            if (dims.w % 2 === 0) finalX += Game.tileSize / 2; if (dims.d % 2 === 0) finalZ += Game.tileSize / 2;
            highlightMesh.position.set(finalX, 0.5, finalZ); highlightMesh.visible = true;
            let color = 0x4ade80;
            if(Game.selectedTool.type === 'connector' && !getAdjacentRide(gx, gz)) color = 0xef4444;
            if(!checkCollision(gx, gz, dims.w, dims.d)) color = 0xef4444;
            highlightMesh.material.color.setHex(color);
        }

        function getAdjacentRide(x, z) {
            const neighbors = [{x:x+10,z:z}, {x:x-10,z:z}, {x:x,z:z+10}, {x:x,z:z-10}];
            for(let n of neighbors) { const b = Game.buildings[`${n.x},${n.z}`]; if(b && b.type === 'ride') return b; }
            return null;
        }

        function checkCollision(ax, az, w, d) {
            const sx = Math.round(highlightMesh.position.x / Game.tileSize - w/2 + 0.5);
            const sz = Math.round(highlightMesh.position.z / Game.tileSize - d/2 + 0.5);
            for(let i=0; i<w; i++) { for(let j=0; j<d; j++) { if(Game.buildings[`${(sx+i)*10},${(sz+j)*10}`]) return false; } }
            return true;
        }

        function handleBuild() {
            if (!highlightMesh.visible) return;
            const dims = getToolDims();
            const sx = Math.round(highlightMesh.position.x / 10 - dims.w/2 + 0.5);
            const sz = Math.round(highlightMesh.position.z / 10 - dims.d/2 + 0.5);
            if(!checkCollision(0,0, dims.w, dims.d)) { showNotification("Blocked!", "error"); return; }
            
            let connRide = null;
            if(Game.selectedTool.type === 'connector') {
                connRide = getAdjacentRide(Math.round(highlightMesh.position.x/10)*10, Math.round(highlightMesh.position.z/10)*10);
                if(!connRide) { showNotification("Must touch a ride!", "error"); return; }
            }
            if (Game.money < Game.selectedTool.cost) { showNotification("Funds low!", "error"); return; }

            updateMoney(-Game.selectedTool.cost);
            let mesh = createAsset(Game.selectedTool.id, Game.selectedTool.type);
            
            if(!mesh) {
                if(Game.selectedTool.id === 'path' || Game.selectedTool.id === 'queue') {
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), getMaterial(Game.selectedTool.color)); mesh.receiveShadow = true;
                } else if(Game.selectedTool.id === 'scenery_bench') {
                     mesh = new THREE.Group();
                     const seat = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 2), getMaterial(0x92400e)); seat.position.y=1; mesh.add(seat);
                     const back = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 0.5), getMaterial(0x92400e)); back.position.set(0,2,-1); mesh.add(back);
                } else {
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(dims.w*8, dims.d*8, dims.w*8), getMaterial(Game.selectedTool.color)); mesh.position.y = 5;
                }
            }

            mesh.position.set(highlightMesh.position.x, 0, highlightMesh.position.z);
            mesh.rotation.y = -Game.rotation * (Math.PI / 2);
            scene.add(mesh);
            spawnParticles(mesh.position.x, 5, mesh.position.z, 0xffffff);

            const bRef = {
                id: Game.selectedTool.id, type: Game.selectedTool.type, mesh: mesh, data: Game.selectedTool,
                entranceLoc: null, exitLoc: null, connectedRide: connRide, pos: { x: mesh.position.x, z: mesh.position.z },
                rotation: Game.rotation,
                paintColor: Game.selectedTool.color
            };

            if(connRide) {
                if(Game.selectedTool.id === 'entrance') { connRide.entranceLoc = bRef.pos; showNotification("Entrance Set!", "success"); }
                else { connRide.exitLoc = bRef.pos; showNotification("Exit Set!", "success"); }
                if(connRide.entranceLoc && connRide.exitLoc) spawnFloatingText("Ride Opened!", connRide.mesh.position.x, 20, connRide.mesh.position.z, '#22c55e');
            }

            for(let i=0; i<dims.w; i++) { for(let j=0; j<dims.d; j++) { Game.buildings[`${(sx+i)*10},${(sz+j)*10}`] = bRef; } }
            if(!connRide) showNotification(`Built ${Game.selectedTool.name}`, "success");
        }

        function handleBulldoze() {
            if(!highlightMesh.visible) return;
            const gx = Math.round(highlightMesh.position.x / 10) * 10; const gz = Math.round(highlightMesh.position.z / 10) * 10;
            const t = Game.buildings[`${gx},${gz}`];
            if(t) {
                updateMoney(Math.floor(t.data.cost * 0.5));
                showNotification("Bulldozed!", "success");
                spawnParticles(t.mesh.position.x, 2, t.mesh.position.z, 0xef4444);
                scene.remove(t.mesh);
                Object.keys(Game.buildings).forEach(k => { if(Game.buildings[k] === t) delete Game.buildings[k]; });
            }
        }

        function handleSelection(e) {
            raycaster.setFromCamera(mouse, camera);
            const guestIntersects = raycaster.intersectObjects(Game.guests.map(g=>g.mesh), true);
            if(guestIntersects.length > 0) {
                const g = Game.guests.find(g => g.mesh === guestIntersects[0].object.parent);
                if(g) {
                    Game.selectedGuest = g; Game.selectedBuilding = null;
                    updateInspector();
                    document.getElementById('inspector-panel').classList.remove('hidden');
                    document.getElementById('insp-guest').classList.remove('hidden');
                    document.getElementById('insp-building').classList.add('hidden');
                    return;
                }
            }
            
            const intersects = raycaster.intersectObject(ground);
            if(intersects.length > 0) {
                const p = intersects[0].point;
                const gx = Math.round(p.x/10)*10; const gz = Math.round(p.z/10)*10;
                const b = Game.buildings[`${gx},${gz}`];
                if(b && b.data) { // Check b.data exists
                    Game.selectedBuilding = b; Game.selectedGuest = null;
                    document.getElementById('bi-name').innerText = b.data.name;
                    document.getElementById('bi-color').value = b.paintColor || '#ffffff';
                    document.getElementById('inspector-panel').classList.remove('hidden');
                    document.getElementById('insp-guest').classList.add('hidden');
                    document.getElementById('insp-building').classList.remove('hidden');
                    return;
                }
            }
            document.getElementById('inspector-panel').classList.add('hidden');
        }

        function updateBuildingColor(hex) {
            if(Game.selectedBuilding && Game.selectedBuilding.mesh.userData.paint) {
                Game.selectedBuilding.paintColor = hex;
                const c = new THREE.Color(hex);
                Game.selectedBuilding.mesh.userData.paint.forEach(mat => mat.color.set(c));
            }
        }

        function updateInspector() {
            if(Game.selectedGuest) {
                document.getElementById('gi-name').innerText = Game.selectedGuest.name;
                document.getElementById('gi-thought').innerText = `"${Game.selectedGuest.thought}"`;
                document.getElementById('gi-cash').innerText = '$' + Math.floor(Game.selectedGuest.money);
                document.getElementById('gi-happy').innerText = Math.floor(Game.selectedGuest.happiness) + '%';
            }
        }

        // --- Pathfinding ---
        function findPath(start, target, allowedTypes) {
            const sX = Math.round(start.x/10)*10, sZ = Math.round(start.z/10)*10;
            const tX = Math.round(target.x/10)*10, tZ = Math.round(target.z/10)*10;
            let queue = [[{x:sX, z:sZ}]]; let visited = new Set([`${sX},${sZ}`]);
            while(queue.length > 0) {
                let path = queue.shift(); let node = path[path.length-1];
                if(node.x === tX && node.z === tZ) return path;
                if(path.length > 30) continue;
                [{x:10,z:0}, {x:-10,z:0}, {x:0,z:10}, {x:0,z:-10}].forEach(d => {
                    const nx = node.x + d.x, nz = node.z + d.z; const k = `${nx},${nz}`;
                    if(!visited.has(k)) {
                        visited.add(k);
                        const b = Game.buildings[k];
                        if((nx===tX && nz===tZ) || (b && allowedTypes.includes(b.id))) queue.push([...path, {x:nx, z:nz}]);
                    }
                });
            }
            return null;
        }

        // --- Guest System ---
        const GUEST_NAMES = ["Alice", "Bob", "Charlie", "Diana", "Evan", "Fiona", "George", "Hannah"];
        class Guest {
            constructor() {
                this.mesh = new THREE.Group();
                const color = Math.random()>0.5?0x3b82f6:0xef4444;
                const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 1.5, 4, 8), getMaterial(color)); b.position.y=1.25; b.castShadow=true; this.mesh.add(b);
                const h = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), getMaterial(0xffd1dc)); h.position.y=2.5; this.mesh.add(h);
                this.name = GUEST_NAMES[Math.floor(Math.random()*GUEST_NAMES.length)];
                this.thought = "Just arrived!"; this.happiness = 100; this.money = 50+Math.floor(Math.random()*100);
                this.x = Game.entrance.x; this.z = Game.entrance.z; this.mesh.position.set(this.x,0,this.z); scene.add(this.mesh);
                this.state = 'idle'; this.path = []; this.targetPos = null;
            }
            update(dt) {
                if(['riding','sitting','using_atm','buying'].includes(this.state)) return;
                if(!this.targetPos && this.path.length===0) this.decide();
                if(this.targetPos) {
                    const dx = this.targetPos.x - this.x; const dz = this.targetPos.z - this.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    if(dist<0.5) { this.x=this.targetPos.x; this.z=this.targetPos.z; if(this.path.length>0) this.targetPos=this.path.shift(); else { this.targetPos=null; this.finishAction(); } }
                    else { const s = 15*dt; this.x += (dx/dist)*s; this.z += (dz/dist)*s; this.mesh.lookAt(this.targetPos.x, this.mesh.position.y, this.targetPos.z); }
                    // Update height based on ground
                    const ray = new THREE.Raycaster(new THREE.Vector3(this.x, 100, this.z), new THREE.Vector3(0,-1,0));
                    const hits = ray.intersectObject(ground);
                    const groundY = hits.length>0 ? hits[0].point.y : 0;
                    this.mesh.position.set(this.x, groundY, this.z); 
                    this.mesh.position.y += Math.abs(Math.sin(Date.now()*0.015))*0.2;
                }
            }
            decide() {
                // Hunger check
                if(Math.random() < 0.05 && this.money >= 10) {
                    const shop = this.findBuilding('shop');
                    if(shop) {
                        const path = findPath({x:this.x, z:this.z}, shop.pos, ['path', shop.id]);
                        if(path) {
                            this.path = path; this.targetPos = this.path.shift();
                            this.state = 'walking_to_shop'; this.targetBuilding = shop; return;
                        }
                    }
                }
                if(this.money < 5 && !this.findBuilding('facility_atm')) { this.startLeaving(); return; }
                if(this.money < 30) {
                    const atm = this.findBuilding('facility_atm');
                    if(atm) { const p=findPath({x:this.x,z:this.z}, atm.pos, ['path','facility_atm']); if(p) { this.path=p; this.targetPos=this.path.shift(); this.state='walking_to_atm'; return; }}
                }
                if(Math.random()<0.02) { const b=this.findBuilding('scenery_bench'); if(b){ const p=findPath({x:this.x,z:this.z}, b.pos, ['path','scenery_bench']); if(p){ this.path=p; this.targetPos=this.path.shift(); this.state='walking_to_bench'; return; }}}
                if(Math.random()<0.1) { const r=this.findRide(); if(r) { const p=findPath({x:this.x,z:this.z}, r.entranceLoc, ['path','queue','entrance']); if(p) { this.path=p; this.targetPos=this.path.shift(); this.targetRide=r; this.state='walking_to_ride'; return; }}}
                const d=this.findRandomPathTile(); if(d) { const p=findPath({x:this.x,z:this.z}, d, ['path']); if(p) { this.path=p; this.targetPos=this.path.shift(); }}
            }
            findBuilding(type) {
                const keys = Object.keys(Game.buildings);
                for(let i=0;i<20;i++) { const k=keys[Math.floor(Math.random()*keys.length)]; const b=Game.buildings[k]; if(b && (type==='shop'?b.type==='shop':b.id===type)) return b; }
                return null;
            }
            findRide() { const keys=Object.keys(Game.buildings); for(let i=0;i<10;i++){ const b=Game.buildings[keys[Math.floor(Math.random()*keys.length)]]; if(b && b.type==='ride' && b.entranceLoc && b.exitLoc && this.money>=b.data.ticketPrice) return b; } return null; }
            findRandomPathTile() { for(let i=0;i<10;i++) { const rx=Math.round((Math.random()*600-300)/10)*10; const rz=Math.round((Math.random()*600-300)/10)*10; const b=Game.buildings[`${rx},${rz}`]; if(b && b.id==='path') return {x:rx, z:rz}; } return null; }
            startLeaving() { this.state='leaving'; const p=findPath({x:this.x,z:this.z}, Game.entrance, ['path','entrance']); if(p) { this.path=p; this.targetPos=this.path.shift(); } else this.despawn=true; }
            finishAction() {
                if(this.state==='walking_to_ride' && this.targetRide) {
                    this.state='riding'; this.mesh.visible=false; updateMoney(this.targetRide.data.ticketPrice); this.money-=this.targetRide.data.ticketPrice; this.thought="Riding!";
                    spawnFloatingText(`$${this.targetRide.data.ticketPrice}`, this.x, 5, this.z, '#22c55e');
                    setTimeout(()=>{ this.state='idle'; this.mesh.visible=true; this.happiness=Math.min(100,this.happiness+20); this.x=this.targetRide.exitLoc.x; this.z=this.targetRide.exitLoc.z; 
                        // Snap to ground on exit
                        this.mesh.position.set(this.x,0,this.z); 
                    }, 4000);
                } else if(this.state==='walking_to_shop' && this.targetBuilding) {
                    this.state='buying'; this.thought="Yum!"; updateMoney(this.targetBuilding.data.income); this.money-=this.targetBuilding.data.income;
                    spawnFloatingText(`$${this.targetBuilding.data.income}`, this.x, 5, this.z, '#fbbf24');
                    spawnParticles(this.x, 2, this.z, 0xffffff); // Eat fx
                    setTimeout(()=>{ this.state='idle'; this.happiness+=5; }, 2000);
                } else if(this.state==='walking_to_atm') { this.state='using_atm'; setTimeout(()=>{ this.money+=50; spawnFloatingText("+$50",this.x,5,this.z,'#fbbf24'); this.state='idle'; },2000); }
                else if(this.state==='walking_to_bench') { this.state='sitting'; this.mesh.rotation.y+=Math.PI; setTimeout(()=>{ this.happiness+=5; this.state='idle'; },5000); }
                else if(this.state==='leaving') this.despawn=true;
                else this.state='idle';
            }
        }

        const particles=[]; function spawnParticles(x,y,z,c){ for(let i=0;i<8;i++){ const p=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), getMaterial(c)); p.position.set(x+(Math.random()-0.5)*2,y,z+(Math.random()-0.5)*2); p.userData={vy:0.2+Math.random()*0.3, life:1.0}; scene.add(p); particles.push(p); } }
        const floatingTexts=[]; function spawnFloatingText(t,x,y,z,c){ const e=document.createElement('div'); e.innerText=t; e.style.position='absolute'; e.style.color=c; e.style.fontWeight='900'; e.style.textShadow='0 2px 4px rgba(0,0,0,0.8)'; document.body.appendChild(e); floatingTexts.push({el:e, pos:new THREE.Vector3(x,y,z), life:1.5}); }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            handleInput();

            for(let i=Game.guests.length-1; i>=0; i--) { const g=Game.guests[i]; g.update(dt); if(g.despawn) { scene.remove(g.mesh); Game.guests.splice(i,1); if(Game.selectedGuest===g) { Game.selectedGuest=null; document.getElementById('inspector-panel').classList.add('hidden'); } } }
            document.getElementById('guest-count').innerText = Game.guests.length;
            if(Game.tick%100===0 && Game.guests.length<100) Game.guests.push(new Guest());

            for(let key in Game.buildings) {
                const b = Game.buildings[key];
                if(b.updatedTick === Game.tick) continue;
                b.updatedTick = Game.tick;
                // Animations
                if(b.mesh.userData.type === 'anim_fountain') { if(Math.random()>0.8) spawnParticles(b.mesh.position.x, 3, b.mesh.position.z, 0x3b82f6); }
                else if(b.mesh.userData.type === 'anim_swing') { b.mesh.userData.angle+=dt*2; b.mesh.userData.target.rotation.x = Math.sin(b.mesh.userData.angle)*0.8; }
                else if(b.mesh.userData.type === 'anim_rotate_y') { b.mesh.userData.target.rotation.y+=dt; }
                else if(b.mesh.userData.type === 'anim_ufo') { b.mesh.userData.angle+=dt*3; b.mesh.userData.target.rotation.y+=dt*2; b.mesh.userData.target.position.y=4+Math.sin(b.mesh.userData.angle)*0.5; }
                else if(b.mesh.userData.type === 'anim_swing_circle') { 
                    b.mesh.userData.target.rotation.y+=dt; 
                    b.mesh.userData.target.children.forEach(c => { if(c.userData.isSwing) c.rotation.x = 0.5; });
                }
                else if(b.mesh.userData.type === 'anim_twist') { b.mesh.userData.target.rotation.y+=dt*2; b.mesh.userData.sub.rotation.x+=dt*3; }
                else if(b.mesh.userData.type === 'anim_path') {
                    const d=b.mesh.userData; d.progress+=dt*d.speed*1000; if(d.progress>1) d.progress=0;
                    const pos=d.curve.getPointAt(d.progress); const tan=d.curve.getTangentAt(d.progress);
                    d.target.position.copy(pos); d.target.lookAt(pos.clone().add(tan));
                }
                else if(b.mesh.userData.type === 'anim_rotate_z') { b.mesh.userData.target.rotation.z+=b.mesh.userData.speed; b.mesh.userData.target.children.forEach(c=>{ if(c.userData.isCabin) c.rotation.z=-b.mesh.userData.target.rotation.z; }); }
                else if(b.mesh.userData.type === 'anim_drop') {
                    const d=b.mesh.userData;
                    if(d.state==='wait'){ d.timer+=dt; if(d.timer>3) { d.state='up'; d.timer=0; } }
                    else if(d.state==='up'){ d.target.position.y+=dt*5; if(d.target.position.y>25){ d.state='hang'; d.target.position.y=25; } }
                    else if(d.state==='hang'){ d.timer+=dt; if(d.timer>1) d.state='drop'; }
                    else if(d.state==='drop'){ d.target.position.y-=dt*40; if(d.target.position.y<2){ d.target.position.y=2; d.state='wait'; spawnParticles(b.mesh.position.x, 2, b.mesh.position.z, 0xffffff); } }
                }
            }

            for(let i=particles.length-1; i>=0; i--) { const p=particles[i]; p.position.y+=p.userData.vy; p.userData.life-=dt; p.scale.multiplyScalar(0.95); if(p.userData.life<=0) { scene.remove(p); particles.splice(i,1); } }
            floatingTexts.forEach((ft,i) => { ft.life-=dt; ft.pos.y+=dt*5; const v=ft.pos.clone().project(camera); const x=(v.x*.5+.5)*window.innerWidth; const y=(-(v.y*.5)+.5)*window.innerHeight; ft.el.style.left=x+'px'; ft.el.style.top=y+'px'; ft.el.style.opacity=ft.life; if(ft.life<=0){ ft.el.remove(); floatingTexts[i]=null; } });
            while(floatingTexts.includes(null)) floatingTexts.splice(floatingTexts.indexOf(null),1);
            if(Game.tick%30===0) updateInspector();
            Game.tick++;
            renderer.render(scene, camera);
        }

        // --- Init ---
        function filterToolbar(cat) { Game.filter = cat; document.querySelectorAll('.category-tab').forEach(el => el.classList.toggle('active', el.textContent.toLowerCase().includes(cat === 'all' ? 'all' : cat))); renderToolbar(); }
        function renderToolbar() {
            const tb = document.getElementById('toolbar'); tb.innerHTML = '';
            const addBtn = (icon, name, cost, color, action) => {
                const d = document.createElement('div'); d.className = 'item-card flex flex-col items-center justify-center w-24 h-24 bg-slate-800 rounded-lg shrink-0';
                if(name === 'Inspect' && !Game.selectedTool) d.classList.add('active');
                d.innerHTML = `<div class="text-3xl">${icon}</div><div class="text-[10px] font-bold mt-1 text-center leading-3">${name}</div><div class="text-xs" style="color:${color}">${cost}</div>`;
                d.onclick = () => {
                    document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('active')); d.classList.add('active');
                    document.getElementById('inspector-panel').classList.add('hidden'); // Hide inspector on tool change
                    action();
                };
                tb.appendChild(d);
            };
            addBtn('👆', 'Inspect', 'Select', '#94a3b8', () => { Game.selectedTool = null; highlightMesh.visible = false; });
            addBtn('🗑️', 'Bulldoze', 'Destroy', '#ef4444', () => { Game.selectedTool = { id: 'bulldoze' }; Game.rotation=0; updateGhost(); });
            for(let k in BUILDING_TYPES) {
                const t = BUILDING_TYPES[k];
                if(Game.filter !== 'all' && t.category !== Game.filter) continue;
                addBtn(t.icon, t.name, '$'+t.cost, '#10b981', () => { Game.selectedTool = t; Game.rotation = 0; updateGhost(); });
            }
        }

        function toggleSaveMenu() { const m = document.getElementById('save-menu'); if(m.classList.contains('hidden')){ m.classList.remove('hidden'); setTimeout(()=>m.classList.remove('opacity-0'),10); renderSaveSlots(); } else { m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300); } }
        function renderSaveSlots() {
            const c = document.getElementById('save-slots'); c.innerHTML = '';
            for(let i=1; i<=3; i++) {
                const k = `thrillengine_save_${i}`; const d = localStorage.getItem(k);
                c.innerHTML += `<div class="bg-slate-800 p-3 rounded-lg flex justify-between items-center"><div><div class="font-bold">Slot ${i}</div><div class="text-xs text-slate-400">${d ? `Saved: $${JSON.parse(d).money.toLocaleString()}` : "Empty"}</div></div><div class="flex gap-2"><button onclick="saveGame(${i})" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded">Save</button><button onclick="loadGame(${i})" class="bg-green-600 hover:bg-green-500 text-xs px-3 py-1 rounded ${!d?'opacity-50':''}" ${!d?'disabled':''}>Load</button></div></div>`;
            }
        }
        function saveGame(s) {
            const bData = []; const seen = new Set();
            for(let k in Game.buildings) { const b = Game.buildings[k]; if(seen.has(b)) continue; seen.add(b); bData.push({id:b.id, type:b.type, x:b.pos.x, z:b.pos.z, r:b.rotation, cRide: b.connectedRide ? b.connectedRide.pos : null, color: b.paintColor}); }
            localStorage.setItem(`thrillengine_save_${s}`, JSON.stringify({money:Game.money, buildings:bData})); renderSaveSlots(); showNotification("Saved!", "success");
        }
        function loadGame(s) {
            const d = JSON.parse(localStorage.getItem(`thrillengine_save_${s}`));
            new Set(Object.values(Game.buildings)).forEach(b=>scene.remove(b.mesh)); Game.buildings={};
            Game.guests.forEach(g=>scene.remove(g.mesh)); Game.guests=[];
            Game.money=d.money; updateMoney(0);
            const loaded=[];
            d.buildings.forEach(bd => {
                const def = Object.values(BUILDING_TYPES).find(t=>t.id===bd.id);
                if(def) {
                    let mesh = createAsset(bd.id, bd.type, bd.color); // Pass color
                    if(!mesh) { mesh = new THREE.Mesh(new THREE.BoxGeometry(10,10,10), getMaterial(0xff0000)); } // Fallback
                    mesh.position.set(bd.x, 0, bd.z); mesh.rotation.y = -(bd.r||0)*(Math.PI/2); scene.add(mesh);
                    const ref = { id:bd.id, type:bd.type, mesh:mesh, data:def, pos:{x:bd.x, z:bd.z}, rotation:bd.r, savedConn:bd.cRide, paintColor:bd.color };
                    loaded.push(ref);
                    let w=def.w, dp=def.d; if((bd.r||0)%2!==0) { w=def.d; dp=def.w; }
                    const sx = Math.round(bd.x/10 - w/2 + 0.5); const sz = Math.round(bd.z/10 - dp/2 + 0.5);
                    for(let i=0;i<w;i++) for(let j=0;j<dp;j++) Game.buildings[`${(sx+i)*10},${(sz+j)*10}`] = ref;
                }
            });
            loaded.forEach(b => { if(b.savedConn) { const r = loaded.find(t => t.pos.x===b.savedConn.x && t.pos.z===b.savedConn.z); if(r) { b.connectedRide=r; if(b.id==='entrance') r.entranceLoc=b.pos; else r.exitLoc=b.pos; } } });
            toggleSaveMenu(); showNotification("Loaded!", "success");
        }

        function init() {
            renderToolbar();
            const ex=Game.entrance.x, ez=Game.entrance.z;
            const pathDef = BUILDING_TYPES.PATH;
            for(let i=0; i<5; i++) { 
                const m=new THREE.Mesh(new THREE.BoxGeometry(10,0.2,10), getMaterial(0x78716c)); 
                m.position.set(ex,0.1,ez-(i*10)); 
                scene.add(m); 
                Game.buildings[`${ex},${ez-(i*10)}`] = {type:'infrastructure',id:'path',mesh:m, data:pathDef, pos:{x:ex, z:ez-(i*10)}}; 
            }
            const gate = new THREE.Group();
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(2,10,2), getMaterial(0xffffff)); p1.position.set(-6,5,0);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(2,10,2), getMaterial(0xffffff)); p2.position.set(6,5,0);
            const top = new THREE.Mesh(new THREE.BoxGeometry(14,2,2), getMaterial(0x3b82f6)); top.position.set(0,9,0);
            gate.add(p1); gate.add(p2); gate.add(top); gate.position.set(ex, 0, ez+5); scene.add(gate);
            animate();
        }
        function updateMoney(v) { Game.money+=v; document.getElementById('money-display').innerText=Game.money.toLocaleString(); }
        function showNotification(m,t) { const n=document.createElement('div'); n.className=`p-2 px-4 rounded shadow mb-2 text-white font-bold text-sm transform transition-all duration-500 translate-x-10 opacity-0`; n.style.background=t==='error'?'#ef4444':'#10b981'; n.innerText=m; document.getElementById('notifications').appendChild(n); setTimeout(()=>n.classList.remove('translate-x-10','opacity-0'),10); setTimeout(()=>{n.classList.add('opacity-0');setTimeout(()=>n.remove(),500);},2000); }

        init();
    </script>
</body>
